name: Flutter Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run focused tests
        run: |
          flutter test test/project_changelog_test.dart
          flutter analyze --no-fatal-infos

      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            dist/Myune-Music-0.9.9-android.325-arm64-v8a.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myune-Music-0.9.9-android.325
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.9.9-android.325 >/dev/null 2>&1 || \
            gh release create v0.9.9-android.325 \
              --title "Myune Music 0.9.9 (Android 325)" \
              --notes "修复 Android 无法导入歌曲的问题，并改进权限回退、错误提示、重复导入保护和文件格式验证。"
          gh release upload v0.9.9-android.325 dist/*.apk dist/SHA256SUMS.txt --clobber
