name: Flutter Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests and analysis
        run: |
          flutter test --no-pub
          flutter analyze --no-pub
          python3 -m unittest discover -s tool/tests -p 'test_*.py'

      - name: Build arm64 release APK
        shell: pwsh
        run: ./tool/build_android_release.ps1 -SkipPubGet

      - name: Stage APK
        id: release
        shell: pwsh
        run: |
          $apks = @(Get-ChildItem -LiteralPath dist -Filter '*-arm64-v8a.apk' -File)
          if ($apks.Count -ne 1) { throw 'Expected exactly one release APK' }
          $artifactName = $apks[0].BaseName -replace '-arm64-v8a$', ''
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          $hash = (Get-FileHash -LiteralPath $apks[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($apks[0].Name)" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
