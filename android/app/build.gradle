plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.myune.music"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = JavaVersion.VERSION_17.toString() }

    defaultConfig {
        // Explicit profile-fixture opt-in: never replace the user's player or
        // data while measuring widgets. Production package/signing unchanged.
        def benchmarkId = project.findProperty("myuneBenchmarkApplicationId")
        if (benchmarkId != null && (benchmarkId != "com.myune.music.benchmark" ||
                !gradle.startParameter.taskNames.every { it.toLowerCase().contains("profile") })) {
            throw new GradleException("Benchmark application id is restricted to Profile tasks")
        }
        applicationId = benchmarkId ?: "com.myune.music"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // A real distribution must replace this with an upload keystore. Signing
    // release with the debug key makes the locally shared APK installable.
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    packaging {
        jniLibs {
            // Compress the sideload APK without removing codecs or changing ELF.
            // Android extracts libraries on install, potentially increasing disk
            // usage. This reduces download size, not RAM usage or frame time.
            useLegacyPackaging = true
        }
    }
}

flutter { source = "../.." }

dependencies {
    implementation "net.jthink:jaudiotagger:3.0.1"
    testImplementation "junit:junit:4.13.2"
}
